# Nginx reverse proxy configuration for AI Proxy on aaPanel VPS
# Place this file in your aaPanel Nginx config directory (e.g. /www/server/panel/vhost/nginx/)
# and include it in the site config, or paste it into aaPanel's site configuration editor.
#
# Assumes the Python proxy runs on localhost:5000 (via Gunicorn or Flask directly).
# Adjust server_name and SSL paths to match your aaPanel site setup.

server {
    listen 80;
    listen [::]:80;
    server_name ai-proxy.yourdomain.com;

    # Redirect HTTP to HTTPS (recommended)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai-proxy.yourdomain.com;

    # SSL certificates (managed by aaPanel Let's Encrypt or custom)
    ssl_certificate /www/server/panel/vhost/cert/ai-proxy.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ai-proxy.yourdomain.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /www/wwwlogs/ai-proxy.yourdomain.com.log;
    error_log /www/wwwlogs/ai-proxy.yourdomain.com.error.log;

    # Rate limiting zone (requires `limit_req_zone` in http block)
    limit_req zone=ai_proxy burst=10 nodelay;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# ---------------------------------------------------------------------------
# NOTE: Add the following to the Nginx http block (nginx.conf main file)
# so the limit_req zone is available. In aaPanel you can edit the main
# nginx.conf via the panel or at /www/server/nginx/conf/nginx.conf:
#
# http {
#     ...
#     limit_req_zone $binary_remote_addr zone=ai_proxy:10m rate=10r/s;
#     ...
# }
# ---------------------------------------------------------------------------

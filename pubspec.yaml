name: expenses_tracker
description: "AI Expenses Tracker - Production Flutter app with Firebase, AI, and VPS sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^10.2.0

  firebase_core: ^2.32.0
  firebase_analytics: ^10.10.7
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.1.6
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  uuid: ^4.4.0
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  http: ^1.2.2
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.3
  image_picker: ^1.1.2
  image: ^4.3.0
  speech_to_text: ^7.3.0
  # google_mobile_ads disabled for prototype build - needs Android Gradle update
  intl: ^0.20.2
  flutter_colorpicker: ^1.1.0
  font_awesome_flutter: ^11.0.0
  fl_chart: ^0.68.0

  expense_repository:
    path: packages/expense_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - .env
    - assets/images/
